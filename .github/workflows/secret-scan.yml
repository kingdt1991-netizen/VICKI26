name: Secret Scan

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout full history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Scan tracked files and history for high-risk secret patterns
        shell: bash
        run: |
          set -euo pipefail
          patterns='(service_role|SUPABASE_SERVICE_ROLE_KEY|BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY|sk-[A-Za-z0-9_-]{20,}|gh[pousr]_[A-Za-z0-9_]{20,}|github_pat_[A-Za-z0-9_]{20,})'
          if git grep -nEI "$patterns" -- ':!*.md' ':!*.meta'; then
            echo 'Potential secret found in tracked files.' >&2
            exit 1
          fi
          if git log -p --all -- . | grep -E "$patterns" >/dev/null; then
            echo 'Potential secret found in git history.' >&2
            exit 1
          fi
          echo 'No high-risk secret patterns detected.'
